<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940"><title>直播场景制作工作流</title><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif}</style><rect width="1600" height="940" fill="#f0f5f3"/><rect width="1600" height="205" fill="#102d35"/><text x="60" y="101" fill="white" font-size="58" font-weight="700">直播场景制作工作流</text><text x="60" y="157" fill="#bfdbd6" font-size="29">把素材发在对话里，其余交给技能管理。</text><rect x="60" y="260" width="450" height="210" rx="20" fill="white" stroke="#d2dfdb"/><text x="84" y="321" fill="#17665d" font-size="30" font-weight="700">01</text><text x="171" y="323" fill="#163d40" font-size="33" font-weight="700">对话发素材</text><text x="84" y="395" fill="#466467" font-size="23">场景参考 + 品类 / 品牌 / 产品</text><text x="84" y="437" fill="#466467" font-size="23">识别角色，自动归档去重</text><rect x="575" y="260" width="450" height="210" rx="20" fill="white" stroke="#d2dfdb"/><text x="599" y="321" fill="#17665d" font-size="30" font-weight="700">02</text><text x="686" y="323" fill="#163d40" font-size="33" font-weight="700">判断与规划</text><text x="599" y="395" fill="#466467" font-size="23">必要调研，选定创意路线</text><text x="599" y="437" fill="#466467" font-size="23">定直播方式、结构、陈列与站位</text><rect x="1090" y="260" width="450" height="210" rx="20" fill="white" stroke="#d2dfdb"/><text x="1114" y="321" fill="#17665d" font-size="30" font-weight="700">03</text><text x="1201" y="323" fill="#163d40" font-size="33" font-weight="700">第一轮生成</text><text x="1114" y="395" fill="#466467" font-size="23">先保存完整提示词</text><text x="1114" y="437" fill="#466467" font-size="23">内置 imagegen，完整舞台取景</text><rect x="1090" y="550" width="450" height="210" rx="20" fill="white" stroke="#d2dfdb"/><text x="1114" y="611" fill="#17665d" font-size="30" font-weight="700">04</text><text x="1201" y="613" fill="#163d40" font-size="33" font-weight="700">查看实际画面</text><text x="1114" y="685" fill="#466467" font-size="23">成人尺度、遮挡、字形与产品</text><text x="1114" y="727" fill="#466467" font-size="23">结构、进深、景深、材质与裁切</text><rect x="575" y="550" width="450" height="210" rx="20" fill="white" stroke="#d2dfdb"/><text x="599" y="611" fill="#17665d" font-size="30" font-weight="700">05</text><text x="686" y="613" fill="#163d40" font-size="33" font-weight="700">第二轮精修</text><text x="599" y="685" fill="#466467" font-size="23">保留成立设计，修正真实缺陷</text><text x="599" y="727" fill="#466467" font-size="23">保存两轮图片、提示词和自检</text><rect x="60" y="550" width="450" height="210" rx="20" fill="white" stroke="#d2dfdb"/><text x="84" y="611" fill="#17665d" font-size="30" font-weight="700">06</text><text x="171" y="613" fill="#163d40" font-size="33" font-weight="700">完整交付</text><text x="84" y="685" fill="#466467" font-size="23">最终图 + 真实像素 + 记录</text><text x="84" y="727" fill="#466467" font-size="23">点击打开当次结果文件夹</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#43877f"/></marker></defs><path d="M520 365 H563" fill="none" stroke="#43877f" stroke-width="4" marker-end="url(#a)"/><path d="M1035 365 H1078" fill="none" stroke="#43877f" stroke-width="4" marker-end="url(#a)"/><path d="M1315 485 V536" fill="none" stroke="#43877f" stroke-width="4" marker-end="url(#a)"/><path d="M1078 655 H1035" fill="none" stroke="#43877f" stroke-width="4" marker-end="url(#a)"/><path d="M563 655 H520" fill="none" stroke="#43877f" stroke-width="4" marker-end="url(#a)"/><rect x="60" y="815" width="1480" height="81" rx="16" fill="#dbeae4"/><text x="90" y="871" fill="#245b57" font-size="28">默认两轮自主完成 · 关键冲突集中询问 · 生成后实际验收 · 不让用户管理文件</text></svg>